<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Quản Lý Cửa Hàng Đèn Xe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Tùy chỉnh màu vàng Amber đặc trưng của đèn xe */
        .text-amber { color: #fbbf24; }
        .bg-amber { background-color: #fbbf24; }
        .border-amber { border-color: #fbbf24; }
        .hover-bg-amber:hover { background-color: #f59e0b; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 font-sans">

    <!-- Thanh Điều Hướng chung -->
    <nav class="bg-gray-800 border-b border-gray-700 p-4 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold text-amber tracking-wider">AUTO<span class="text-white">LIGHTS</span></h1>
            
            <!-- Nút chuyển đổi giữa giao diện Khách và Admin -->
            <button id="toggleViewBtn" onclick="toggleView()" class="bg-gray-700 hover:bg-gray-600 text-white font-semibold py-2 px-4 rounded border border-gray-600 transition">
                ⚙️ Chuyển sang Trang Quản Trị
            </button>
        </div>
    </nav>

    <!-- ========================================== -->
    <!-- 1. GIAO DIỆN KHÁCH HÀNG (CỬA HÀNG) -->
    <!-- ========================================== -->
    <main id="storeView" class="max-w-7xl mx-auto p-6 block">
        <div class="text-center my-10">
            <h2 class="text-4xl font-extrabold uppercase mb-4">Sản Phẩm <span class="text-amber">Nổi Bật</span></h2>
            <p class="text-gray-400">Chuyên các dòng đèn trợ sáng Future Eyes và giải pháp tăng sáng cho Raptor, Hilux.</p>
        </div>

        <!-- Lưới hiển thị sản phẩm -->
        <div id="productGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- Sản phẩm sẽ được Javascript tự động nạp vào đây -->
        </div>
    </main>

    <!-- ========================================== -->
    <!-- 2. GIAO DIỆN QUẢN TRỊ (ADMIN) -->
    <!-- ========================================== -->
    <main id="adminView" class="max-w-7xl mx-auto p-6 hidden">
        <div class="mb-8">
            <h2 class="text-3xl font-bold text-amber mb-2">Bảng Điều Khiển (Admin)</h2>
            <p class="text-gray-400">Thêm, sửa, xóa sản phẩm tại đây. Dữ liệu sẽ tự cập nhật ra ngoài cửa hàng.</p>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Cột Trái: Form thêm sản phẩm -->
            <div class="bg-gray-800 p-6 rounded-lg border border-gray-700 lg:col-span-1 h-fit">
                <h3 class="text-xl font-semibold mb-4 border-b border-gray-700 pb-2">➕ Thêm Sản Phẩm Mới</h3>
                <form id="addProductForm" onsubmit="addProduct(event)">
                    <div class="mb-4">
                        <label class="block text-sm font-medium mb-1">Tên Sản Phẩm</label>
                        <input type="text" id="prodName" required class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-white focus:outline-none focus:border-amber" placeholder="VD: Đèn Nóc Future Eyes">
                    </div>
                    <div class="mb-4">
                        <label class="block text-sm font-medium mb-1">Giá Bán (VNĐ)</label>
                        <input type="number" id="prodPrice" required class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-white focus:outline-none focus:border-amber" placeholder="VD: 3500000">
                    </div>
                    <div class="mb-4">
                        <label class="block text-sm font-medium mb-1">Đường dẫn hình ảnh (Link URL)</label>
                        <input type="url" id="prodImage" required class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-white focus:outline-none focus:border-amber" placeholder="https://link-anh-cua-ban.jpg">
                    </div>
                    <button type="submit" class="w-full bg-amber hover-bg-amber text-gray-900 font-bold py-2 px-4 rounded transition">
                        Đăng Sản Phẩm
                    </button>
                </form>
            </div>

            <!-- Cột Phải: Danh sách sản phẩm đang có -->
            <div class="bg-gray-800 p-6 rounded-lg border border-gray-700 lg:col-span-2">
                <h3 class="text-xl font-semibold mb-4 border-b border-gray-700 pb-2">📦 Danh Sách Sản Phẩm Đang Bán</h3>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-gray-900 text-gray-400">
                                <th class="p-3 border-b border-gray-700">Hình ảnh</th>
                                <th class="p-3 border-b border-gray-700">Tên SP</th>
                                <th class="p-3 border-b border-gray-700">Giá</th>
                                <th class="p-3 border-b border-gray-700 text-right">Thao tác</th>
                            </tr>
                        </thead>
                        <tbody id="adminProductTable">
                            <!-- Danh sách sản phẩm Admin sẽ hiện ở đây -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- MÃ JAVASCRIPT XỬ LÝ LƯU TRỮ VÀ HIỂN THỊ DỮ LIỆU -->
    <script>
        // Dữ liệu mẫu ban đầu (Nếu website chưa có dữ liệu)
        const defaultProducts = [
            {
                id: 1,
                name: "Thanh Đèn LED Nóc Future Eyes F150",
                price: 4500000,
                image: "https://images.unsplash.com/photo-1549646849-c12b1c7fc017?auto=format&fit=crop&q=80&w=800"
            },
            {
                id: 2,
                name: "Bi Cầu LED Trợ Sáng Hilux Đi Sương",
                price: 2200000,
                image: "https://images.unsplash.com/photo-1629853909789-705a60c0422c?auto=format&fit=crop&q=80&w=800"
            },
            {
                id: 3,
                name: "Bộ Rơ-le & Công Tắc Không Dây",
                price: 850000,
                image: "https://images.unsplash.com/photo-1616422285623-22dc9cb463c5?auto=format&fit=crop&q=80&w=800"
            }
        ];

        // Khởi tạo mảng sản phẩm từ bộ nhớ trình duyệt (localStorage), nếu không có thì lấy dữ liệu mẫu
        let products = JSON.parse(localStorage.getItem("myProducts")) || defaultProducts;

        // Hàm Lưu dữ liệu
        function saveToStorage() {
            localStorage.setItem("myProducts", JSON.stringify(products));
        }

        // Định dạng tiền tệ VNĐ
        function formatMoney(amount) {
            return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(amount);
        }

        // 1. Render giao diện Khách Hàng
        function renderStore() {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';
            
            if (products.length === 0) {
                grid.innerHTML = '<p class="text-gray-400 col-span-full text-center">Chưa có sản phẩm nào. Hãy vào trang Quản Trị để thêm!</p>';
                return;
            }

            products.forEach(p => {
                grid.innerHTML += `
                    <div class="bg-gray-800 rounded-xl overflow-hidden shadow-lg border border-gray-700 hover:border-amber transition duration-300">
                        <img src="${p.image}" alt="${p.name}" class="w-full h-56 object-cover">
                        <div class="p-5">
                            <h3 class="text-xl font-bold mb-2 truncate">${p.name}</h3>
                            <p class="text-amber font-extrabold text-2xl mb-4">${formatMoney(p.price)}</p>
                            <button class="w-full bg-transparent border border-amber text-amber hover:bg-amber hover:text-gray-900 font-bold py-2 px-4 rounded transition">
                                Đặt Hàng Ngay
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        // 2. Render giao diện Admin
        function renderAdminTable() {
            const table = document.getElementById('adminProductTable');
            table.innerHTML = '';
            
            products.forEach(p => {
                table.innerHTML += `
                    <tr class="hover:bg-gray-700 border-b border-gray-700 transition">
                        <td class="p-3"><img src="${p.image}" class="w-16 h-16 object-cover rounded border border-gray-600"></td>
                        <td class="p-3 font-semibold">${p.name}</td>
                        <td class="p-3 text-amber font-bold">${formatMoney(p.price)}</td>
                        <td class="p-3 text-right">
                            <button onclick="deleteProduct(${p.id})" class="text-red-400 hover:text-red-300 bg-red-900 bg-opacity-30 p-2 rounded">
                                🗑️ Xóa
                            </button>
                        </td>
                    </tr>
                `;
            });
        }

        // 3. Xử lý sự kiện Thêm Sản Phẩm
        function addProduct(e) {
            e.preventDefault(); // Ngăn trang tải lại
            const name = document.getElementById('prodName').value;
            const price = document.getElementById('prodPrice').value;
            const image = document.getElementById('prodImage').value;

            const newProduct = {
                id: Date.now(), // Tạo ID ngẫu nhiên bằng thời gian thực
                name: name,
                price: parseInt(price),
                image: image
            };

            products.push(newProduct);
            saveToStorage(); // Lưu vào bộ nhớ
            
            renderStore();      // Cập nhật cửa hàng
            renderAdminTable(); // Cập nhật bảng Admin
            
            document.getElementById('addProductForm').reset(); // Xóa trắng form
            alert("Đã thêm sản phẩm thành công!");
        }

        // 4. Xử lý sự kiện Xóa Sản Phẩm
        function deleteProduct(id) {
            if(confirm("Bạn có chắc chắn muốn xóa sản phẩm này?")) {
                products = products.filter(p => p.id !== id);
                saveToStorage();
                renderStore();
                renderAdminTable();
            }
        }

        // 5. Tính năng chuyển đổi qua lại giữa Store và Admin
        let isAdminView = false;
        function toggleView() {
            isAdminView = !isAdminView;
            const storeView = document.getElementById('storeView');
            const adminView = document.getElementById('adminView');
            const btn = document.getElementById('toggleViewBtn');

            if (isAdminView) {
                storeView.classList.add('hidden');
                adminView.classList.remove('hidden');
                btn.innerHTML = "👀 Trở về Cửa Hàng";
                btn.classList.replace('bg-gray-700', 'bg-amber');
                btn.classList.replace('text-white', 'text-gray-900');
            } else {
                storeView.classList.remove('hidden');
                adminView.classList.add('hidden');
                btn.innerHTML = "⚙️ Chuyển sang Trang Quản Trị";
                btn.classList.replace('bg-amber', 'bg-gray-700');
                btn.classList.replace('text-gray-900', 'text-white');
            }
        }

        // Khởi động giao diện lần đầu tiên
        renderStore();
        renderAdminTable();
    </script>
</body>
</html>
