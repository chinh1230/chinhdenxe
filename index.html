  <script>
    document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();

      const heroSlides = [...document.querySelectorAll(".hero-slide")];
      const heroDots = [...document.querySelectorAll(".dot")];
      let heroIndex = 0;
      let heroTimer;

      function showHero(index) {
        heroIndex = (index + heroSlides.length) % heroSlides.length;
        heroSlides.forEach((slide, i) => slide.classList.toggle("is-active", i === heroIndex));
        heroDots.forEach((dot, i) => dot.classList.toggle("is-active", i === heroIndex));
      }

      function resetHeroTimer() {
        clearInterval(heroTimer);
        heroTimer = setInterval(() => showHero(heroIndex + 1), 6000);
      }

      heroDots.forEach((dot) => {
        dot.addEventListener("click", () => {
          showHero(Number(dot.dataset.slide));
          resetHeroTimer();
        });
      });
      resetHeroTimer();

      const projectSlides = [...document.querySelectorAll(".project-slide")];
      const projectDots = [...document.querySelectorAll(".project-dot")];
      const projectCounter = document.getElementById("projectCounter");
      let projectIndex = 0;
      let projectTimer;

      function showProject(index) {
        projectIndex = (index + projectSlides.length) % projectSlides.length;
        projectSlides.forEach((slide, i) => slide.classList.toggle("is-active", i === projectIndex));
        projectDots.forEach((dot, i) => dot.classList.toggle("is-active", i === projectIndex));
        projectCounter.textContent = String(projectIndex + 1).padStart(2, "0") + " / " + String(projectSlides.length).padStart(2, "0");
      }

      function resetProjectTimer() {
        clearInterval(projectTimer);
        projectTimer = setInterval(() => showProject(projectIndex + 1), 5000);
      }

      document.getElementById("projectPrev").addEventListener("click", () => {
        showProject(projectIndex - 1);
        resetProjectTimer();
      });

      document.getElementById("projectNext").addEventListener("click", () => {
        showProject(projectIndex + 1);
        resetProjectTimer();
      });

      projectDots.forEach((dot) => {
        dot.addEventListener("click", () => {
          showProject(Number(dot.dataset.project));
          resetProjectTimer();
        });
      });
      resetProjectTimer();

      const form = document.getElementById("quoteForm");
      const formSuccess = document.getElementById("formSuccess");
      const formError = document.getElementById("formError");
      const submitButton = form.querySelector('button[type="submit"]');
      let storageReady = false;

      const dataHandler = {
        onDataChanged() {
          // Form submissions are intentionally write-only for visitor privacy.
        }
      };

      async function initializeSheet() {
        const result = await window.dataSdk.init(dataHandler);
        storageReady = result.isOk;
        if (!result.isOk) {
          formError.textContent = "Chưa thể kết nối để gửi yêu cầu. Vui lòng thử lại sau.";
          formError.classList.remove("hidden");
        }
      }

      initializeSheet();

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        formError.classList.add("hidden");

        if (!storageReady) {
          formError.textContent = "Yêu cầu đang chuẩn bị. Vui lòng thử lại sau ít phút.";
          formError.classList.remove("hidden");
          return;
        }

        submitButton.disabled = true;
        const originalContent = submitButton.innerHTML;
        submitButton.innerHTML = '<span class="heading-font text-base font-extrabold uppercase">Đang gửi yêu cầu...</span>';

        const record = {
          car_model: document.getElementById("car-model").value.trim(),
          item_name: document.getElementById("item-name").value.trim(),
          note: document.getElementById("note").value.trim(),
          created_at: new Date().toISOString()
        };

        const result = await window.dataSdk.create(record);

        if (result.isOk) {
          form.reset();
          form.classList.add("hidden");
          formSuccess.classList.remove("hidden");
          lucide.createIcons();
        } else {
          formError.textContent = "Gửi yêu cầu chưa thành công. Vui lòng thử lại.";
          formError.classList.remove("hidden");
          submitButton.disabled = false;
          submitButton.innerHTML = originalContent;
          lucide.createIcons();
        }
      });

      document.getElementById("newRequestButton").addEventListener("click", () => {
        formSuccess.classList.add("hidden");
        form.classList.remove("hidden");
        submitButton.disabled = false;
        lucide.createIcons();
      });
    });
  </script>
